name: Build Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write  # needed for provenance attestation
  attestations: write

jobs:
  build_package:
    name: Build pure-Python wheel and sdist
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Set up Python
        uses: actions/setup-python@39cd14951b08e74b54015e9e001cdefcf80e669f # v5.1.1
        with:
          python-version: '3.11'

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip==26.2.1
          pip install build==1.6.0 setuptools==84.0.0 wheel==0.48.0
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct HEAD)
          python -m build --sdist --wheel --outdir dist/

      - name: Verify Reproducibility
        run: python scripts/verify_reproducibility.py

      - name: Generate CycloneDX SBOM
        run: |
          pip install cyclonedx-bom==4.1.2
          cyclonedx-py environment --outfile dist/SBOM.json

      - name: Generate SHA256SUMS.txt
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt

      - name: Upload Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: ./dist/*

      - name: Attest provenance
        uses: actions/attest-build-provenance@92c65d2898f1f53cfdc910b962cecff86e7f8fcc # v1.4.1
        with:
          subject-path: ./dist/*
