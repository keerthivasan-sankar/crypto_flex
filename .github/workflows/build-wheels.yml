name: Build Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write  # needed for provenance attestation
  attestations: write

jobs:
  build_package:
    name: Build pure-Python wheel and sdist
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@39cd14951b08e74b54015e9e001cdefcf80e669f # v5.1.1
        with:
          python-version: '3.11'

      - name: Resolve source commit metadata
        id: get_commit
        run: |
          COMMIT_SHA=$(git rev-parse HEAD)
          COMMIT_TS=$(git log -1 --format=%ct "$COMMIT_SHA")
          echo "sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"
          echo "timestamp=$COMMIT_TS" >> "$GITHUB_OUTPUT"

      - name: Build sdist and wheel
        env:
          SOURCE_DATE_EPOCH: ${{ steps.get_commit.outputs.timestamp }}
        run: |
          python -m venv .build_venv
          .build_venv/bin/python -m pip install --upgrade pip==26.2.1
          .build_venv/bin/pip install build==1.6.0 setuptools==84.0.0 wheel==0.48.0
          python -c "from pathlib import Path; from scripts.verify_reproducibility import extract_source_tree; extract_source_tree(Path('.'), '${{ steps.get_commit.outputs.sha }}', Path('ci_build'))"
          cd ci_build
          ../.build_venv/bin/python -m build --sdist --wheel --outdir ../dist/

      - name: Verify Reproducibility (hard release gate)
        env:
          SOURCE_DATE_EPOCH: ${{ steps.get_commit.outputs.timestamp }}
        run: |
          python scripts/verify_reproducibility.py \
            --source-ref ${{ steps.get_commit.outputs.sha }} \
            --reference-dir dist/

      - name: Generate release metadata
        env:
          COMMIT_SHA: ${{ steps.get_commit.outputs.sha }}
          SOURCE_DATE_EPOCH: ${{ steps.get_commit.outputs.timestamp }}
        run: |
          .build_venv/bin/python scripts/generate_release_metadata.py \
            --dist-dir dist \
            --commit-sha "$COMMIT_SHA" \
            --source-date-epoch "$SOURCE_DATE_EPOCH"

      - name: Set up SBOM tooling
        run: |
          python -m venv .sbom_tools
          .sbom_tools/bin/pip install --upgrade pip==26.2.1
          .sbom_tools/bin/pip install cyclonedx-bom==4.1.2 jsonschema==4.23.0

      - name: Generate Base Runtime SBOM
        run: |
          python -m venv .sbom_runtime
          .sbom_runtime/bin/pip install --upgrade pip==26.2.1
          .sbom_runtime/bin/pip install dist/cryptoflex-0.5.5-py3-none-any.whl
          .sbom_runtime/bin/python -m pip check
          .sbom_tools/bin/cyclonedx-py environment .sbom_runtime/bin/python \
            --pyproject pyproject.toml \
            --mc-type library \
            --schema-version 1.5 \
            --output-reproducible \
            --outfile dist/SBOM.json

      - name: Generate PQC Runtime SBOM
        run: |
          python -m venv .sbom_pqc
          .sbom_pqc/bin/pip install --upgrade pip==26.2.1
          .sbom_pqc/bin/pip install dist/cryptoflex-0.5.5-py3-none-any.whl[pqc]
          .sbom_pqc/bin/python -m pip check || { echo "PQC environment install failed"; exit 1; }
          .sbom_tools/bin/cyclonedx-py environment .sbom_pqc/bin/python \
            --pyproject pyproject.toml \
            --mc-type library \
            --schema-version 1.5 \
            --output-reproducible \
            --outfile dist/SBOM-pqc.json

      - name: Normalize SBOMs (drop bootstrap packages, explicit empty leaf dependsOn)
        run: |
          .sbom_tools/bin/python scripts/normalize_sbom.py \
            dist/SBOM.json dist/SBOM-pqc.json

      - name: Validate SBOMs
        run: |
          .sbom_tools/bin/python scripts/verify_sbom.py \
            --base dist/SBOM.json \
            --pqc dist/SBOM-pqc.json \
            --runtime-env .sbom_runtime \
            --pqc-env .sbom_pqc

      - name: Generate SHA256SUMS.txt
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt

      - name: Upload Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-package-distributions
          path: ./dist/*

      - name: Attest provenance
        uses: actions/attest-build-provenance@92c65d2898f1f53cfdc910b962cecff86e7f8fcc # v1.4.1
        with:
          subject-path: ./dist/*
