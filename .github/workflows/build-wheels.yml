name: Build Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write  # needed for provenance attestation
  attestations: write

jobs:
  build_package:
    name: Build pure-Python wheel and sdist
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Resolve source commit metadata
        id: get_commit
        run: |
          COMMIT_SHA=$(git rev-parse HEAD)
          COMMIT_TS=$(git log -1 --format=%ct "$COMMIT_SHA")
          echo "sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"
          echo "timestamp=$COMMIT_TS" >> "$GITHUB_OUTPUT"

      - name: Build sdist and wheel
        env:
          SOURCE_DATE_EPOCH: ${{ steps.get_commit.outputs.timestamp }}
        run: |
          python -m venv .build_venv
          .build_venv/bin/python -m pip install --upgrade pip==26.2.1
          .build_venv/bin/pip install build==1.6.0 setuptools==84.0.0 wheel==0.48.0
          python -c "from pathlib import Path; from scripts.verify_reproducibility import extract_source_tree; extract_source_tree(Path('.'), '${{ steps.get_commit.outputs.sha }}', Path('ci_build'))"
          cd ci_build
          ../.build_venv/bin/python -m build --sdist --wheel --outdir ../dist/

      - name: Verify Reproducibility (hard release gate)
        env:
          SOURCE_DATE_EPOCH: ${{ steps.get_commit.outputs.timestamp }}
        run: |
          python scripts/verify_reproducibility.py \
            --source-ref ${{ steps.get_commit.outputs.sha }} \
            --reference-dir dist/

      - name: Generate CycloneDX SBOM
        run: |
          pip install cyclonedx-bom==4.1.2
          cyclonedx-py environment --outfile dist/SBOM.json

      - name: Generate SHA256SUMS.txt
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt

      - name: Upload Artifacts
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        with:
          name: python-package-distributions
          path: ./dist/*

      - name: Attest provenance
        uses: actions/attest-build-provenance@92c65d2898f1f53cfdc910b962cecff86e7f8fcc # v1.4.1
        with:
          subject-path: ./dist/*
