name: Windows CA Bundle Validation

on:
  push:
    branches:
      - windows-ca-bundle-validation
      - main
  pull_request:
    branches:
      - main


jobs:
  validate-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package (dev deps)
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Run real Windows CA bundle validation test
        run: |
          pytest -q tests/test_windows_real.py
