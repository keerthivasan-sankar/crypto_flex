name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@39cd14951b08e74b54015e9e001cdefcf80e669f # v5.1.1
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (dev deps)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (pyflakes)
        run: |
          pip install pyflakes
          python -m pyflakes cryptoflex/

      - name: Run tests (PQC disabled — fast matrix)
        env:
          CRYPTOFLEX_DISABLE_PQC: "1"
        run: pytest -v

      - name: Verify minimum cryptography version compatibility
        run: |
          pip install "cryptography==50.0.0"
          python -c "
          import cryptography
          assert cryptography.__version__ == '50.0.0', f'Expected 50.0.0, got {cryptography.__version__}'
          from cryptoflex import PolicyEngine, establish_keys, export_keyset_bytes, import_keyset_bytes, encrypt, decrypt
          keyset = establish_keys(PolicyEngine())
          pw = 'testpass'
          k = export_keyset_bytes(keyset, pw, use_argon2=True)
          keyset_imported = import_keyset_bytes(k, pw)
          pt = b'test payload'
          ct = encrypt(keyset.public_bundle, pt)
          assert decrypt(keyset_imported.private_handles, ct) == pt
          print('Minimum cryptography version 50.0.0 compatibility verified successfully.')
          "

  test-with-real-pqc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@39cd14951b08e74b54015e9e001cdefcf80e669f # v5.1.1
        with:
          python-version: "3.12"

      - name: Build and install native liboqs C library
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential libssl-dev
          # Checkout liboqs at the immutable commit for tag 0.16.0
          # SHA independently verified: git ls-remote --tags https://github.com/open-quantum-safe/liboqs.git 0.16.0
          # => 5a1a854b0dc9f2141bdc771c555ee60c37950183  refs/tags/0.16.0
          git clone https://github.com/open-quantum-safe/liboqs.git /tmp/liboqs
          cd /tmp/liboqs
          git checkout 5a1a854b0dc9f2141bdc771c555ee60c37950183
          mkdir build && cd build
          cmake -GNinja -DBUILD_SHARED_LIBS=ON -DOQS_USE_OPENSSL=ON ..
          ninja
          sudo ninja install
          sudo ldconfig /usr/local/lib

      - name: Install package with PQC extra
        run: |
          python -m pip install --upgrade pip
          pip install liboqs-python==0.16.0
          pip install -e ".[dev,pqc]"

      - name: Run full test suite with real liboqs
        run: pytest -v

  reproducibility:
    runs-on: ubuntu-latest
    needs: [test, test-with-real-pqc]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify reproducibility
        run: python scripts/verify_reproducibility.py

