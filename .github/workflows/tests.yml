name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (dev deps)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (pyflakes)
        run: |
          pip install pyflakes
          python -m pyflakes cryptoflex/

      - name: Run tests (PQC disabled — fast matrix)
        env:
          CRYPTOFLEX_DISABLE_PQC: "1"
        run: pytest -v

  test-with-real-pqc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and install native liboqs C library
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential libssl-dev
          git clone --depth 1 https://github.com/open-quantum-safe/liboqs.git /tmp/liboqs
          cd /tmp/liboqs
          mkdir build && cd build
          cmake -GNinja -DBUILD_SHARED_LIBS=ON -DOQS_USE_OPENSSL=ON ..
          ninja
          sudo ninja install
          sudo ldconfig /usr/local/lib

      - name: Install package with PQC extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,pqc]"

      - name: Run full test suite with real liboqs
        run: pytest -v
